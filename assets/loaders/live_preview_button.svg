<svg xmlns="http://www.w3.org/2000/svg" width="320" height="50" viewBox="0 0 320 50">
  <defs>
    <!-- Premium Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Flowing Neon Linear Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE">
        <animate attributeName="stop-color" values="#00F2FE;#4FACFE;#9b51e0;#00F2FE" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#4FACFE">
        <animate attributeName="stop-color" values="#4FACFE;#9b51e0;#00F2FE;#4FACFE" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#9b51e0">
        <animate attributeName="stop-color" values="#9b51e0;#00F2FE;#4FACFE;#9b51e0" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
  </defs>
  
  <!-- Outer Pulsing Neon Glow Container -->
  <rect x="5" y="5" width="310" height="40" rx="20" fill="url(#neonGradient)" filter="url(#glow)" opacity="0.8">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite" />
  </rect>
  
  <!-- Solid Dark Body backing -->
  <rect x="7" y="7" width="306" height="36" rx="18" fill="#09090F" />
  
  <!-- Animated Border Stroke -->
  <rect x="8" y="8" width="304" height="34" rx="17" fill="none" stroke="url(#neonGradient)" stroke-width="2" />
  
  <!-- Breathing Neon Text Layer -->
  <text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="#00C2FF" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="bold" letter-spacing="1.5">
    ⚡ TRY INTERACTIVE DASHBOARD
    <animate attributeName="fill" values="#00C2FF;#FFFFFF;#00C2FF" dur="2s" repeatCount="indefinite" />
  </text>
</svg>
