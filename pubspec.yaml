name: flutter_motion_kit
description: "Centralized high-performance Flutter animation and loader library. Premium loaders, glassmorphism, 3D tilt cards, transitions, and shaders in one package."
version: 1.0.0
homepage: https://github.com/flutter-motion-kit/flutter_motion_kit
repository: https://github.com/flutter-motion-kit/flutter_motion_kit
issue_tracker: https://github.com/flutter-motion-kit/flutter_motion_kit/issues

environment:
  sdk: ">=3.0.0 <4.0.0"

platforms:
  android:
  ios:
  web:

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  shimmer: ^3.0.0
  lottie: ^3.1.2
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.2
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
